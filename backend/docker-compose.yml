services:
  postgres:
    image: "postgres:16.4"
    container_name: postgres-database-dp
    environment:
      POSTGRES_USER: ${PGSQL_USER}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD}
      POSTGRES_DB: db
      DATABASE_HOST: localhost
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres-data:
    name: dp-postgres-data-16.4
